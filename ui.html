<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L.A.T.E.</title>
<style nonce="__NONCE__">
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e7e9ee; --dim:#8b93a3; --accent:#7c9cff; --ok:#4ade80; --bad:#f87171; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand b { font-size: 17px; letter-spacing: .5px; }
  .brand span { color: var(--dim); margin-left: 10px; font-size: 13px; }
  .meta { color: var(--dim); font-size: 12.5px; text-align: right; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { flex: 1; overflow-y: auto; padding: 22px 16px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .empty { text-align: center; color: var(--dim); padding: 40px 10px; }
  .empty h2 { color: var(--text); margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip { font-size: 13px; color: var(--text); }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: #22304f; border: 1px solid #2e4170; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .msg a { color: var(--accent); }
  .steps { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .steps:empty { display: none; }
  .step { color: var(--dim); }
  .step::before { content: "\2192  "; }
  .step.running::after { content: "  ..."; }
  .step.ok { color: var(--ok); }
  .step.fail { color: var(--bad); }
  .step .sum { color: var(--dim); }
  .plan { color: var(--dim); font-size: 13px; border-left: 2px solid var(--line); padding-left: 10px; margin-bottom: 8px; }
  .thinking { color: var(--dim); font-style: italic; }
  .error { color: var(--bad); }
  pre { background: #0b0d12; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
  .msg.ai { position: relative; }
  .copy { position: absolute; top: 8px; right: 8px; padding: 2px 9px; font-size: 12px; color: var(--dim); opacity: 0; transition: opacity .15s; }
  .msg.ai:hover .copy { opacity: 1; }
  .approval { border: 1px solid #6b5a1e; background: #2a2412; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .approval-title { font-weight: 600; color: #fbbf24; }
  .approval-file { margin-top: 4px; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .approval pre { max-height: 180px; overflow: auto; }
  .approval-buttons { display: flex; gap: 8px; }
  .approval-buttons .allow { background: var(--ok); color: #0b0d12; border-color: var(--ok); }
  .approval-buttons .deny { color: var(--bad); }
  .approval.allowed { border-color: #1f5e37; background: #12261a; }
  .approval.denied { border-color: #6b2a2a; background: #2a1414; }
  .approval-status { color: var(--dim); font-size: 13px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  .bar { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .modes { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .modes button { border: 0; border-radius: 0; background: transparent; color: var(--dim); }
  .modes button.on { background: var(--accent); color: #0b0d12; }
  textarea { flex: 1; resize: none; max-height: 160px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: inherit; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .hint { max-width: 820px; margin: 6px auto 0; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>L.A.T.E.</b><span>Local AI Tool Engine</span></div>
  <div class="meta"><span id="meta">connecting...</span> <button id="clear" title="Start a new conversation">New chat</button></div>
</header>
<main id="main"><div class="wrap" id="chat">
  <div class="empty" id="empty">
    <h2>Give your model real tools</h2>
    <div>Exact math, research with sources, your files, memory, weather. Try one:</div>
    <div class="chips" id="chips"></div>
  </div>
</div></main>
<footer>
  <div class="bar">
    <div class="modes"><button id="m-chat" class="on" title="Answer one question, using tools when needed">Chat</button><button id="m-agent" title="Work through a bigger goal step by step">Agent</button></div>
    <textarea id="box" rows="1" placeholder="Ask something..." autofocus></textarea>
    <button id="send">Send</button>
  </div>
  <div class="hint" id="hint">Enter to send, Shift+Enter for a new line.</div>
</footer>
<script nonce="__NONCE__">
"use strict";
const TOKEN = "__LATE_TOKEN__";
const $ = (id) => document.getElementById(id);
const chat = $("chat"), main = $("main"), box = $("box"), sendBtn = $("send");
let mode = "chat";
let busy = false;

const EXAMPLES = [
  "research how React hooks work",
  "what is 245 * 37?",
  "convert 5 km to miles",
  "what's the weather in Delhi?",
  "remember I'm building a Next.js app",
  "search my files for TODO"
];

function api(path, options) {
  const opts = options || {};
  return fetch(path, Object.assign({}, opts, { headers: Object.assign({ "Content-Type": "application/json", "X-Late-Token": TOKEN }, opts.headers || {}) }));
}
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
// Text only (never innerHTML). Links are made from a strict http(s) pattern.
function linkify(container, text) {
  String(text).split(/(https?:\/\/[^\s<>"')]+)/g).forEach((part, i) => {
    if (i % 2 === 1) {
      const a = el("a", "", part);
      a.href = part; a.target = "_blank"; a.rel = "noopener noreferrer";
      container.appendChild(a);
    } else {
      container.appendChild(document.createTextNode(part));
    }
  });
}
// Answers can contain ``` code blocks. Everything is still added as text, never as HTML.
function render(container, text) {
  container.textContent = "";
  String(text).split(/```[a-zA-Z0-9_+-]*\n?/).forEach((part, i) => {
    if (i % 2 === 1) {
      const pre = el("pre");
      pre.appendChild(el("code", "", part.replace(/\n$/, "")));
      container.appendChild(pre);
    } else {
      linkify(container, part);
    }
  });
}
const toBottom = () => { main.scrollTop = main.scrollHeight; };
const shortArgs = (args) => { const t = JSON.stringify(args || {}); return t.length > 80 ? t.slice(0, 80) + "..." : t; };

function setBusy(value) {
  busy = value;
  sendBtn.disabled = value;
  box.disabled = value;
  $("clear").disabled = value;
  if (!value) box.focus();
}

function setMode(next) {
  mode = next;
  $("m-chat").classList.toggle("on", next === "chat");
  $("m-agent").classList.toggle("on", next === "agent");
  box.placeholder = next === "agent" ? "Give it a goal, it works through it step by step..." : "Ask something...";
  $("hint").textContent = next === "agent"
    ? "Agent mode: it plans, uses several tools and stops by itself. Up to a few minutes on small models."
    : "Enter to send, Shift+Enter for a new line.";
}

async function send(text) {
  const message = String(text).trim();
  if (busy || !message) return;
  setBusy(true);
  const empty = $("empty");
  if (empty) empty.remove();

  chat.appendChild(el("div", "msg user", message));
  const bubble = el("div", "msg ai");
  const steps = el("div", "steps");
  const answer = el("div", "answer");
  const waiting = el("div", "thinking", "Working on it...");
  answer.appendChild(waiting);
  bubble.append(steps, answer);
  chat.appendChild(bubble);
  toBottom();

  const rows = {};
  let streamNode = null;
  let finished = false;
  const fail = (text) => { answer.textContent = ""; answer.appendChild(el("div", "error", text)); };

  function handle(event) {
    if (event.type === "plan") {
      steps.parentNode.insertBefore(el("div", "plan", "Plan:\n" + event.text), steps);
    } else if (event.type === "step") {
      const row = el("div", "step running", event.tool + "(" + shortArgs(event.args) + ")");
      rows[event.step] = row;
      steps.appendChild(row);
    } else if (event.type === "result") {
      const row = rows[event.step];
      if (row) {
        row.classList.remove("running");
        row.classList.add(event.ok ? "ok" : "fail");
        row.appendChild(el("span", "sum", "  " + event.summary));
      }
    } else if (event.type === "token") {
      if (!streamNode) {
        answer.textContent = "";
        streamNode = document.createTextNode("");
        answer.appendChild(streamNode);
      }
      streamNode.nodeValue += event.text;
    } else if (event.type === "approval") {
      showApproval(event);
    } else if (event.type === "done") {
      finished = true;
      render(answer, event.answer);
      const copy = el("button", "copy", "Copy");
      copy.addEventListener("click", () => {
        navigator.clipboard.writeText(event.answer).then(() => {
          copy.textContent = "Copied";
          setTimeout(() => { copy.textContent = "Copy"; }, 1500);
        }).catch(() => {});
      });
      bubble.appendChild(copy);
    } else if (event.type === "error") {
      finished = true;
      fail(event.message);
    }
    toBottom();
  }

  // The assistant wants to do something that changes things (like saving a file) and is asking first.
  function showApproval(event) {
    const info = event.preview || {};
    const card = el("div", "approval");
    card.appendChild(el("div", "approval-title", "Allow " + event.tool + "?"));
    const label = info.file ? info.file + (info.bytes !== undefined ? "   (" + info.bytes + " bytes, saved in the ai-output folder)" : "") : shortArgs(event.args);
    card.appendChild(el("div", "approval-file", label));
    if (info.text) card.appendChild(el("pre", "", info.text));
    const buttons = el("div", "approval-buttons");
    const yes = el("button", "allow", "Allow");
    const all = el("button", "", "Allow all in this task");
    const no = el("button", "deny", "Deny");
    async function reply(allow) {
      yes.disabled = true;
      all.disabled = true;
      no.disabled = true;
      await api("/api/approve", { method: "POST", body: JSON.stringify({ id: event.id, allow: allow }) }).catch(() => {});
      card.classList.add(allow ? "allowed" : "denied");
      buttons.replaceWith(el("div", "approval-status", allow === "all" ? "Allowed, and I'll keep allowing in this task" : allow ? "Allowed" : "Denied"));
    }
    yes.addEventListener("click", () => reply(true));
    all.addEventListener("click", () => reply("all"));
    no.addEventListener("click", () => reply(false));
    buttons.append(yes, all, no);
    card.appendChild(buttons);
    bubble.insertBefore(card, answer);
    toBottom();
  }

  try {
    const res = await api("/api/chat", { method: "POST", body: JSON.stringify({ message: message, mode: mode }) });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || "Request failed (" + res.status + ")");
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });
      let newline;
      while ((newline = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, newline).trim();
        buffer = buffer.slice(newline + 1);
        if (line) handle(JSON.parse(line));
      }
    }
    if (!finished) fail("The connection closed before the answer finished.");
  } catch (error) {
    fail(error.message);
  } finally {
    setBusy(false);
    toBottom();
  }
}

box.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    const text = box.value;
    box.value = "";
    box.style.height = "auto";
    send(text);
  }
});
box.addEventListener("input", () => {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 160) + "px";
});
sendBtn.addEventListener("click", () => { const text = box.value; box.value = ""; box.style.height = "auto"; send(text); });
$("m-chat").addEventListener("click", () => setMode("chat"));
$("m-agent").addEventListener("click", () => setMode("agent"));
$("clear").addEventListener("click", async () => {
  if (busy) return;
  await api("/api/clear", { method: "POST", body: "{}" }).catch(() => {});
  chat.textContent = "";
  location.reload();
});

EXAMPLES.forEach((text) => {
  const chip = el("button", "chip", text);
  chip.addEventListener("click", () => send(text));
  $("chips").appendChild(chip);
});

// Earlier messages (kept on the server when history is turned on)
api("/api/history").then((res) => res.json()).then((data) => {
  const list = (data && data.messages) || [];
  if (!list.length) return;
  const empty = $("empty");
  if (empty) empty.remove();
  list.forEach((m) => {
    if (m.role === "user") chat.appendChild(el("div", "msg user", m.content));
    else { const bubble = el("div", "msg ai"); const answer = el("div", "answer"); render(answer, m.content); bubble.appendChild(answer); chat.appendChild(bubble); }
  });
  toBottom();
}).catch(() => {});

api("/api/info").then((res) => res.json()).then((info) => {

  $("meta").textContent = info.provider + " / " + info.model + " / " + info.tools.length + " tools";
  $("meta").title = info.tools.map((tool) => tool.name).join(", ");
}).catch(() => { $("meta").textContent = "offline"; });
</script>
</body>
</html>
